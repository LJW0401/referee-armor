<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Armor 控制台</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">ESP32-C3 USB CDC</p>
        <h1>Armor 控制台</h1>
        <p id="connection-state" class="state disconnected">未连接</p>
      </header>
      <section class="card" aria-labelledby="connection-title">
        <h2 id="connection-title">连接设备</h2>
        <div class="connection-controls">
          <label>串口<select id="port-select" aria-label="串口"></select></label>
          <button id="refresh-ports" type="button">刷新串口</button>
          <button id="connect" type="button">连接 ESP32</button>
          <button id="disconnect" type="button" disabled>断开</button>
        </div>
        <p id="message" role="alert"></p>
      </section>
      <section class="grid" aria-label="设备状态">
        <article class="card"><h2>设备身份</h2><dl id="device-info"><dt>状态</dt><dd>等待连接</dd></dl></article>
        <article class="card"><h2>重量</h2><output id="weight">--</output><p id="weight-detail">等待有效样本</p></article>
        <article class="card"><h2>双侧灯条</h2><p>左右灯条会始终使用相同颜色。</p><div class="presets"><button type="button" data-color="#0000ff">蓝色</button><button type="button" data-color="#ff0000">红色</button><button type="button" data-color="#8000ff">紫色</button></div><label>自定义颜色<input id="color-picker" type="color" value="#0000ff"></label><button id="apply-color" type="button" disabled>应用颜色</button></article>
        <article class="card"><h2>运行状态</h2><dl id="runtime-status"><dt>状态</dt><dd>等待连接</dd></dl></article>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
