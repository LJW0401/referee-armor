; ESP32-C3 SuperMini development environment.
; The SuperMini uses the ESP32-C3FN4 module and is pin-compatible with
; Espressif's ESP32-C3-DevKitM-1 definition in PlatformIO.
[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Use the ESP32-C3's native USB CDC interface for Serial.
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1

